services:
  - type: web
    name: sunsync
    env: python
    region: frankfurt
    plan: free
    buildCommand: "pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.1 && pip install -r src/requirements.txt"
    startCommand: "uvicorn src.app:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: SENTRY_DSN
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: TABPFN_TOKEN
        sync: false
      - key: GEMMA_TIMEOUT_S
        value: 8.0
      # Tiny-instance hygiene: cap BLAS/OpenMP thread pools so numpy/torch
      # never spike CPU/RAM on the 512MB free instance during TabPFN fits.
      - key: OMP_NUM_THREADS
        value: 1
      - key: MKL_NUM_THREADS
        value: 1
      - key: OPENBLAS_NUM_THREADS
        value: 1
