services:
  - type: web
    name: sunsync
    env: python
    region: frankfurt
    plan: free
    buildCommand: "pip install -r src/requirements.txt"
    startCommand: "uvicorn src.app:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: SENTRY_DSN
        sync: false
      - key: ENVIRONMENT
        value: production
