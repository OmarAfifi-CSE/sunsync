<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <linearGradient id="logoSunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="logoOrbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Sun Emblem -->
  <g transform="translate(6, 6)">
    <circle cx="24" cy="24" r="17" fill="#FEF3C7"/>
    <g stroke="url(#logoSunGrad)" stroke-width="2.5" stroke-linecap="round">
      <line x1="24" y1="4" x2="24" y2="8.5"/>
      <line x1="24" y1="39.5" x2="24" y2="44"/>
      <line x1="4" y1="24" x2="8.5" y2="24"/>
      <line x1="39.5" y1="24" x2="44" y2="24"/>
      <line x1="9.8" y1="9.8" x2="13.2" y2="13.2"/>
      <line x1="34.8" y1="34.8" x2="38.2" y2="38.2"/>
      <line x1="9.8" y1="38.2" x2="13.2" y2="34.8"/>
      <line x1="34.8" y1="13.2" x2="38.2" y2="9.8"/>
    </g>
    <ellipse cx="24" cy="24" rx="14" ry="14" fill="none" stroke="url(#logoOrbitGrad)" stroke-width="1.8" stroke-dasharray="4 3"/>
    <circle cx="24" cy="24" r="8.5" fill="url(#logoSunGrad)" filter="url(#logoGlow)"/>
    <circle cx="21" cy="21" r="2.8" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- Logotype : dark ink for light backgrounds -->
  <text x="66" y="34" font-family="'Outfit', -apple-system, sans-serif" font-size="26" font-weight="800" letter-spacing="-0.5" fill="#1C1917">Sun<tspan fill="#EA580C">Sync</tspan></text>
  <text x="67" y="47" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" letter-spacing="1.5" fill="#A8A29E">CIRCADIAN PHOTOBIOLOGY</text>
</svg>
