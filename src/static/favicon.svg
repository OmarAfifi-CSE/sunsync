<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Obsidian Disc for Tab Visibility -->
  <rect width="64" height="64" rx="16" fill="#070a12"/>
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="rgba(245,158,11,0.3)" stroke-width="1.5"/>

  <!-- Outer Solar Rays -->
  <g stroke="url(#sunGrad)" stroke-width="3" stroke-linecap="round" opacity="0.95">
    <line x1="32" y1="7" x2="32" y2="13"/>
    <line x1="32" y1="51" x2="32" y2="57"/>
    <line x1="7" y1="32" x2="13" y2="32"/>
    <line x1="51" y1="32" x2="57" y2="32"/>
    <line x1="14" y1="14" x2="19" y2="19"/>
    <line x1="45" y1="45" x2="50" y2="50"/>
    <line x1="14" y1="50" x2="19" y2="45"/>
    <line x1="45" y1="19" x2="50" y2="14"/>
  </g>

  <!-- 480nm Melanopic Blue-Cyan Orbital Ring -->
  <circle cx="32" cy="32" r="18" fill="none" stroke="url(#orbitGrad)" stroke-width="2" stroke-dasharray="5 3" opacity="0.9"/>

  <!-- Glowing Radiant Sun Core -->
  <circle cx="32" cy="32" r="11" fill="url(#sunGrad)" filter="url(#glow)"/>

  <!-- Inner Corona Light Flare -->
  <circle cx="28" cy="28" r="3.5" fill="#ffffff" opacity="0.75"/>
</svg>
