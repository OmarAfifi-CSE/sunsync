<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sunGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="orbitGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- Warm paper tile for light browser chrome -->
  <rect width="64" height="64" rx="16" fill="#FFFBEB"/>
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="#F59E0B" stroke-width="1.5" opacity="0.6"/>

  <!-- Outer Solar Rays -->
  <g stroke="url(#sunGradL)" stroke-width="3.5" stroke-linecap="round" opacity="0.95">
    <line x1="32" y1="8" x2="32" y2="14"/>
    <line x1="32" y1="50" x2="32" y2="56"/>
    <line x1="8" y1="32" x2="14" y2="32"/>
    <line x1="50" y1="32" x2="56" y2="32"/>
    <line x1="15" y1="15" x2="19.5" y2="19.5"/>
    <line x1="44.5" y1="44.5" x2="49" y2="49"/>
    <line x1="15" y1="49" x2="19.5" y2="44.5"/>
    <line x1="44.5" y1="19.5" x2="49" y2="15"/>
  </g>

  <!-- 480nm Melanopic Orbital Ring -->
  <circle cx="32" cy="32" r="17" fill="none" stroke="url(#orbitGradL)" stroke-width="2.2" stroke-dasharray="5 3" opacity="0.9"/>

  <!-- Radiant Sun Core -->
  <circle cx="32" cy="32" r="10.5" fill="url(#sunGradL)"/>

  <!-- Light Flare -->
  <circle cx="28.5" cy="28.5" r="3" fill="#ffffff" opacity="0.8"/>
</svg>
